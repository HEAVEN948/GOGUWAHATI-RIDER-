<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#6D3FC7">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --purple-deep: #241436;
    --purple: #6D3FC7;
    --purple-light: #9B7FE8;
    --gold: #F2B705;
    --river: #3E8FB0;
    --bg: #0A0A0C;
    --card-bg: #17151C;
    --card-border: #2A2732;
    --text: #F2F0F7;
    --text-muted: #9A96A8;
    --danger: #E24C4B;
    --success: #2AAE6C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 76px; }
  h1,h2,h3,.brand-font { font-family: 'Poppins', sans-serif; }

  .hero {
    position: relative;
    background: linear-gradient(180deg, var(--purple-deep) 0%, var(--purple) 100%);
    color: #fff;
    padding: 18px 20px 60px;
    overflow: hidden;
  }
  .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .brand-row { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
  .brand-row svg { width: 26px; height: 26px; }
  .hero-status { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; margin-top: 6px; }
  .hero-sub { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  .skyline { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; z-index: 0; }
  .hero-content { position: relative; z-index: 1; }

  main { max-width: 480px; margin: 0 auto; padding: 0 16px; }
  .card {
    background: var(--card-bg); border-radius: 14px; padding: 18px;
    margin-top: -34px; margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(36,20,54,0.08);
    position: relative; z-index: 2;
  }
  .card.tight { margin-top: 14px; }
  .pill-btn { width: 100%; padding: 15px; border: none; border-radius: 30px; font-weight: 700; font-size: 16px; cursor: pointer; font-family: 'Poppins', sans-serif; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-gold { background: var(--gold); color: var(--purple-deep); }
  .btn-outline { background: transparent; border: 2px solid var(--purple); color: var(--purple-light); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-flat { background: #F0EBFA; color: var(--purple-deep); }
  button { font-family: inherit; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select { width: 100%; padding: 12px; border: 1px solid var(--card-border); border-radius: 8px; font-size: 15px; font-family: inherit; background: #0F0D14; color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--purple); }

  .loc-box { border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; margin-bottom: 4px; }
  .loc-box .loc-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .loc-box .loc-value { font-size: 14px; font-weight: 600; }
  .loc-btn { margin-top: 8px; width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-size: 13px; background: #F0EBFA; color: var(--purple); }

  /* ===== Address search (autocomplete dropdown) ===== */
  .search-wrap { position: relative; }
  .search-results {
    position: absolute; left: 0; right: 0; top: 100%; background: var(--card-bg);
    border: 1px solid var(--card-border); border-top: none; border-radius: 0 0 8px 8px;
    max-height: 220px; overflow-y: auto; z-index: 50; box-shadow: 0 6px 14px rgba(0,0,0,0.08);
  }
  .search-result-item { padding: 11px 12px; font-size: 13px; border-bottom: 1px solid var(--card-border); cursor: pointer; color: var(--text); }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:active { background: #F0EBFA; }
  .search-loading { padding: 10px 12px; font-size: 12px; color: var(--text-muted); }

  #destMap { width: 100%; height: 240px; border-radius: 10px; margin: 8px 0; }

  .status-section { text-align: center; }
  .status-icon { width: 60px; height: 60px; border-radius: 50%; background: #F0EBFA; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }
  .status-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .status-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #F0EBFA; color: var(--purple); margin-bottom: 10px; }

  .driver-info { background: var(--bg); border-radius: 10px; padding: 14px; text-align: left; margin: 14px 0; overflow: hidden; }
  .driver-info .name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .driver-info .phone { font-size: 13px; color: var(--text-muted); }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .action-grid a, .action-grid button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; border: none; }
  .btn-call { background: #E3F7EC; color: var(--success); }
  .btn-wa { background: #E3F2FD; color: #1E6FD9; }

  .route-summary { font-size: 13px; color: var(--text-muted); text-align: left; margin: 14px 0; line-height: 1.6; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .pickup-dot { background: var(--river); }
  .drop-dot { background: var(--gold); }

  .btn-secondary { background: #2A2440; color: var(--purple-light); }

  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; border-top: 1px solid var(--card-border); z-index: 10; }
  .tab { flex: 1; text-align: center; padding: 10px 0 8px; cursor: pointer; color: var(--text-muted); font-size: 11px; font-weight: 600; }
  .tab.active { color: var(--purple); }
  .tab svg { display: block; margin: 0 auto 3px; width: 22px; height: 22px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; z-index: 100; }
  .modal-sheet { background: var(--card-bg); border-radius: 20px 20px 0 0; padding: 22px; width: 100%; max-width: 480px; margin: 0 auto; }
  .modal-sheet h3 { margin-bottom: 14px; }
  .reason-option { display: block; width: 100%; text-align: left; padding: 13px; margin-bottom: 8px; border: 1px solid var(--card-border); border-radius: 10px; background: #0F0D14; font-size: 14px; color: var(--text); }
  .reason-option:active { background: #F0EBFA; border-color: var(--purple); }

  .star-row { display: flex; justify-content: center; gap: 8px; margin: 16px 0; }
  .star-row span { font-size: 34px; cursor: pointer; color: #ddd; }
  .star-row span.filled { color: var(--gold); }

  .trip-row { padding: 14px 0; border-bottom: 1px solid var(--card-border); }
  .trip-row:last-child { border-bottom: none; }
  .trip-top { display: flex; justify-content: space-between; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
  .section-title { font-weight: 700; font-size: 15px; margin: 18px 0 10px; }
  .credit-line { text-align: center; font-size: 12px; color: #aaa; margin: 24px 0 10px; }
</style>
</head>

// ================= SOUND ALERTS (Web Audio, no files needed) =================
// Same autoplay-policy fix as the driver app: audio only plays reliably if a
// user tap has "unlocked" it first. We unlock on the first tap anywhere, and
// explicitly on Login/Register/Book Ride (all real taps).
let audioCtx;
let audioUnlocked = false;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function unlockAudio() {
  if (audioUnlocked) return;
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  playTone(440, 0.01, 0);
  audioUnlocked = true;
}
function playTone(freq, duration, delay, type='sine') {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
  gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + delay + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration + 0.05);
}

// Straight-line ("as the crow flies") distance in km between two GPS
// points — free, simple math, no directions API needed. Not actual road
// distance, but a fair, honest approximation for "how far away" the driver
// currently is.
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Embedded live map showing the driver's marker on an actual map (not just
// a distance number) — free OpenStreetMap tiles, same as the booking
// screen's map. Redrawn fresh each time the driver's position updates
// (~every 6 seconds), which keeps both the driver and the pickup/
// destination point correctly framed, at the small cost of the view
// re-centering each refresh rather than preserving a rider's manual pan/zoom.
let liveRideMapInstance = null;
function renderLiveRideMap(ride) {
  const container = document.getElementById('liveRideMap');
  if (!container || !ride.driverLiveLat || !ride.driverLiveLng) return;

  if (liveRideMapInstance) { liveRideMapInstance.remove(); liveRideMapInstance = null; }

  liveRideMapInstance = L.map('liveRideMap', { zoomControl: false, attributionControl: false, scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(liveRideMapInstance);

  const driverLatLng = [ride.driverLiveLat, ride.driverLiveLng];
  const driverIcon = L.divIcon({
    className: '',
    html: '<div style="background:#6D3FC7; width:18px; height:18px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 6px rgba(0,0,0,0.5);"></div>',
    iconSize: [18, 18]
  });
  L.marker(driverLatLng, { icon: driverIcon }).addTo(liveRideMapInstance);

  const targetLat = ride.status === 'accepted' ? ride.pickupLat : ride.destLat;
  const targetLng = ride.status === 'accepted' ? ride.pickupLng : ride.destLng;
  if (targetLat && targetLng) {
    const targetIcon = L.divIcon({
      className: '',
      html: '<div style="background:#F2B705; width:16px; height:16px; border-radius:50%; border:3px solid #241436;"></div>',
      iconSize: [16, 16]
    });
    L.marker([targetLat, targetLng], { icon: targetIcon }).addTo(liveRideMapInstance);
    liveRideMapInstance.fitBounds([driverLatLng, [targetLat, targetLng]], { padding: [28, 28] });
  } else {
    liveRideMapInstance.setView(driverLatLng, 14);
  }
}

// Live address search tries Mappls (MapmyIndia) first — it has much deeper

// OpenStreetMap. Mappls' autosuggest only returns a place ID ("eLoc"), not
// coordinates — so once the rider picks a suggestion, one more call resolves
// that eLoc into an actual lat/lng before the pin gets placed. If Mappls
// fails at any step (key/domain issue, network error, unexpected response),
// it automatically falls back to Photon/Nominatim so the search always works.
function setupAddressSearch(inputId, resultsId, onSelect) {
  const input = document.getElementById(inputId);
  const resultsBox = document.getElementById(resultsId);
  let debounceTimer = null;
  let activeToken = 0;

  function searchMappls(query, myToken) {
    return fetch(`https://search.mappls.com/search/places/autosuggest/json?query=${encodeURIComponent(query)}&location=26.1445,91.7362&region=IND&access_token=${MAPPLS_KEY}`)
      .then(r => { if (!r.ok) throw new Error('Mappls HTTP ' + r.status); return r.json(); })
      .then(data => {
        const raw = data.suggestedLocations || [];
        if (!raw.length) throw new Error('Mappls: no results');
        const items = raw.map(loc => ({
          label: loc.placeAddress || loc.placeName || '',
          eLoc: loc.eLoc
        })).filter(it => it.label && it.eLoc);
        if (!items.length) throw new Error('Mappls: unusable results');
        showResults(items, myToken);
      });
  }

  function searchPhoton(query, myToken) {
    return fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=6&lon=91.7362&lat=26.1445`)
      .then(r => { if (!r.ok) throw new Error('Photon HTTP ' + r.status); return r.json(); })
      .then(data => {
        const features = (data && data.features) || [];
        const items = features.map(f => ({
          label: [f.properties.name, f.properties.street, f.properties.city || f.properties.district, f.properties.state, f.properties.country]
            .filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join(', '),
          lat: f.geometry.coordinates[1],
          lon: f.geometry.coordinates[0]
        }));
        showResults(items, myToken);
      });
  }

  // Mappls' free tier returns a place ID ("eLoc") from Autosuggest but does
  // NOT return coordinates for it — converting eLoc to lat/lng is a premium
  // (paid) feature on their platform. Instead, once a rider picks a Mappls
  // suggestion, we resolve its full address text through a single one-off
  // Nominatim lookup — this works much better than Nominatim's own live
  // search, since a complete address string geocodes far more reliably than
  // a bare business name typed a few letters at a time.
  function resolveAddressCoords(label) {
    return fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(label)}`)
      .then(r => r.json())
      .then(results => {
        if (!results || !results.length) throw new Error('Could not locate that address on the map');
        return { lat: parseFloat(results[0].lat), lon: parseFloat(results[0].lon) };
      });
  }

  function showResults(items, myToken) {
    if (myToken !== activeToken) return;
    if (items.length === 0) { resultsBox.innerHTML = `<div class="search-loading">No matches found</div>`; return; }
    resultsBox.innerHTML = items.map((it, i) => `<div class="search-result-item" data-idx="${i}">${it.label}</div>`).join('');
    resultsBox.querySelectorAll('.search-result-item').forEach(item => {
      item.addEventListener('click', () => {
        const it = items[item.dataset.idx];
        input.value = it.label;
        resultsBox.innerHTML = `<div class="search-loading">Pinpointing location…</div>`;
        if (it.eLoc) {
          // Mappls result — resolve its address text into coordinates
          resolveAddressCoords(it.label)
            .then(coords => { resultsBox.style.display = 'none'; onSelect(coords.lat, coords.lon, it.label); })
            .catch(() => {
              resultsBox.style.display = 'none';
              alert('Found the address but could not pinpoint it on the map — please try tapping the map directly, or pick a different suggestion.');
            });
        } else {
          // Photon result — coordinates already included
          resultsBox.style.display = 'none';
          onSelect(it.lat, it.lon, it.label);
        }
      });
    });
  }

  input.addEventListener('input', () => {
    const query = input.value.trim();
    clearTimeout(debounceTimer);
    if (query.length < 3) { resultsBox.style.display = 'none'; resultsBox.innerHTML = ''; return; }
    resultsBox.style.display = 'block';
    resultsBox.innerHTML = `<div class="search-loading">Searching…</div>`;
    const myToken = ++activeToken;
    debounceTimer = setTimeout(() => {
      let mapplsError = '';
      searchMappls(query, myToken)
        .catch(err => {
          mapplsError = (err && err.message) || 'unknown Mappls error';
          console.warn('Mappls search failed, falling back to Photon:', mapplsError);
          return searchPhoton(query, myToken);
        })
        .catch(err => {
          if (myToken !== activeToken) return;
          const photonError = (err && err.message) || 'unknown Photon error';
          console.error('Both Mappls and Photon failed:', mapplsError, photonError);
          resultsBox.innerHTML = `<div class="search-loading">Search failed.<br><small>Mappls: ${mapplsError}<br>Photon: ${photonError}</small></div>`;
        });
    }, 350);
  });

  document.addEventListener('click', e => {
    if (e.target !== input) resultsBox.style.display = 'none';
  });
}

// Loads Mappls' Map SDK script once (lazily, only when a map is actually
// needed). If it fails to load or errors for any reason — free-tier
// restriction, network issue, wrong response — the destination preview
// automatically falls back to the OpenStreetMap/Leaflet map that was
// already working, so the booking form never breaks either way.
let mapplsSdkPromise = null;
function loadMapplsSdk() {
  if (mapplsSdkPromise) return mapplsSdkPromise;
  mapplsSdkPromise = new Promise((resolve, reject) => {
    if (window.mappls) { resolve(window.mappls); return; }
    const script = document.createElement('script');
    script.src = `https://sdk.mappls.com/map/sdk/web?v=3.0&access_token=${MAPPLS_KEY}`;
    script.onload = () => { window.mappls ? resolve(window.mappls) : reject(new Error('Mappls SDK loaded but mappls object missing')); };
    script.onerror = () => reject(new Error('Mappls SDK script failed to load'));
    document.head.appendChild(script);
    setTimeout(() => reject(new Error('Mappls SDK load timed out')), 8000);
  });
  return mapplsSdkPromise;
}

let destMapProvider = null; // 'mappls' or 'leaflet' — whichever actually ended up loading

function initDestMap() {
  setTimeout(() => {
    const container = document.getElementById('destMap');
    if (!container) return;
    // Read-only preview map: no click-to-pin, since a tourist/rider unfamiliar
    // with the area has no way to know which exact spot to tap. Destination
    // is set purely via the search bar; the marker below is placed
    // automatically once a search result is picked (see setupAddressSearch's
    // onSelect for destSearch).
    loadMapplsSdk().then(mappls => {
      destMapProvider = 'mappls';
      destMapInstance = new mappls.Map('destMap', { center: { lat: 26.1445, lng: 91.7362 }, zoomControl: false });
    }).catch(err => {
      console.warn('Mappls map unavailable, falling back to OpenStreetMap:', err.message);
      destMapProvider = 'leaflet';
      destMapInstance = L.map('destMap', { dragging: true, scrollWheelZoom: false, tap: false }).setView([26.1445, 91.7362], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(destMapInstance);
    });
  }, 50);
}

function reverseGeocode(lat, lng, callback) {
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
    .then(r => r.json())
    .then(data => callback(data.display_name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`))
    .catch(() => callback(`${lat.toFixed(4)}, ${lng.toFixed(4)}`));
}

function submitRequest() {
  const fareOffer = document.getElementById('inpFare').value.trim();
  if (!pickupCoords) { alert('Please set your pickup location.'); return; }
  if (!destCoords) { alert('Please set your destination.'); return; }
  if (!fareOffer) { alert('Please enter a fare offer.'); return; }

  // A 4-digit OTP the rider shares with the driver only once they've
  // physically arrived — this confirms both sides that it's genuinely the
  // matched driver and passenger, not a mix-up or a stranger.
  const otp = String(Math.floor(1000 + Math.random() * 9000));

  const newRef = db.ref('rideRequests').push();
  newRef.set({
    riderId,
    riderName: riderProfile.name,
    riderPhone: riderProfile.phone,
    pickup: pickupCoords.label,
    pickupLat: pickupCoords.lat,
    pickupLng: pickupCoords.lng,
    destination: destCoords.label,
    destLat: destCoords.lat,
    destLng: destCoords.lng,
    fareOffer,
    vehicleType: selectedVehicleType,
    otp,
    status: 'requested',
    createdAt: Date.now()
  }).then(() => {
    activeRequestId = newRef.key;
    localStorage.setItem('gg_activeRequestId', newRef.key);
    pickupCoords = null; destCoords = null;
    lastKnownRideStatus = 'requested';
    renderHome();
  }).catch(() => alert('Could not post request. Please try again.'));
}

// ================= WATCH ACTIVE REQUEST =================
let chatNotifyRideId = null;
let chatNotifyMsgCount = 0;

function watchRequest(id) {
  db.ref('rideRequests/' + id).on('value', snapshot => {
    const ride = snapshot.val();
    if (!ride) { clearActiveRequest(); renderHome(); return; }
    if (ride.status === 'completed') {
      db.ref('rideRequests/' + id).off(); // this ride is finalized, stop listening to it
      stopChatNotifications();
      if (liveRideMapInstance) { liveRideMapInstance.remove(); liveRideMapInstance = null; }
      clearActiveRequest();
      renderHome(); // dashboard goes straight back to "Book a ride" — the finished ride lives in History, not here
      openCompletionModal(id, ride);
      return;
    }
    if (ride.status === 'cancelled') {
      db.ref('rideRequests/' + id).off();
      stopChatNotifications();
      if (liveRideMapInstance) { liveRideMapInstance.remove(); liveRideMapInstance = null; }
      clearActiveRequest();
      renderCancelledScreen();
      return;
    }

    // Sound alerts on status transitions (a driver being newly assigned, or
    // arriving to pick you up), not on every generic Firebase update.
    if (lastKnownRideStatus === 'requested' && ride.status === 'accepted') {
      playDriverAssignedSound();
    }
    if (lastKnownRideStatus === 'accepted' && ride.status === 'in_progress') {
      playDriverArrivedSound();
    }
    lastKnownRideStatus = ride.status;

    startChatNotifications(id);
    heroStatus.textContent = ride.status === 'requested' ? 'Finding a driver…' : ride.status === 'accepted' ? 'Driver assigned!' : 'Ride in progress';
    heroSub.textContent = '';
    renderRideStatus(id, ride);
  });
}

// Plays a short alert whenever the driver sends a new chat message, even if
// the chat window isn't currently open, so a rider never misses "I'm here"
// or "where are you" type messages.
function startChatNotifications(id) {
  if (chatNotifyRideId === id) return; // already listening to this ride
  stopChatNotifications();
  chatNotifyRideId = id;
  chatNotifyMsgCount = 0;
  let firstLoad = true;
  db.ref('rideRequests/' + id + '/messages').on('value', snap => {
    const msgs = snap.val() || {};
    const list = Object.values(msgs).sort((a, b) => a.ts - b.ts);
    if (!firstLoad && list.length > chatNotifyMsgCount) {
      const newest = list[list.length - 1];
      if (newest.sender !== 'rider') playChatMessageSound();
    }
    chatNotifyMsgCount = list.length;
    firstLoad = false;
  });
}
function stopChatNotifications() {
  if (chatNotifyRideId) { db.ref('rideRequests/' + chatNotifyRideId + '/messages').off(); chatNotifyRideId = null; }
}

function clearActiveRequest() {
  activeRequestId = null;
  localStorage.removeItem('gg_activeRequestId');
  lastKnownRideStatus = null;
}

function renderRideStatus(id, ride) {
  let icon, title, sub, driverBlock = '', cancelBtn = '', offersBlock = '';

  if (ride.status === 'requested') {
    icon = '🔍'; title = 'Finding a driver…'; sub = 'Waiting for a driver to accept your request';
    cancelBtn = `<button class="btn-secondary pill-btn" id="btnCancel">Cancel Request</button>`;
    offersBlock = renderOffers(id, ride.offers);
  } else if (ride.status === 'accepted' || ride.status === 'in_progress') {
    icon = ride.status === 'accepted' ? '✅' : '🚗';
    title = ride.status === 'accepted' ? 'Driver assigned!' : 'Driver arrived — ride in progress';
    sub = ride.status === 'accepted' ? 'Your driver is on the way' : 'Enjoy your ride!';

    if (cachedDriverPhotoId !== ride.driverId) {
      db.ref('drivers/' + ride.driverId + '/photoBase64').once('value', snap => {
        cachedDriverPhoto = snap.val();
        cachedDriverPhotoId = ride.driverId;
        renderRideStatus(id, ride);
      });
    }
    const photoHtml = (cachedDriverPhotoId === ride.driverId && cachedDriverPhoto)
      ? `<img src="${cachedDriverPhoto}" style="width:54px; height:54px; border-radius:50%; object-fit:cover; float:left; margin-right:12px;">`
      : `<div style="width:54px; height:54px; border-radius:50%; background:#2A2440; float:left; margin-right:12px; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--text-muted);">${(ride.driverName||'D').charAt(0)}</div>`;

    // OTP: shown only while waiting for pickup, so the rider can read it out
    // to the driver in person to confirm it's genuinely the matched driver.
    // Once the ride is in progress, that check has already happened, so a
    // small "Verified" tag replaces it instead of the code.
    const otpBlock = ride.otp
      ? (ride.status === 'accepted'
          ? `<div style="background:#F0EBFA; border-radius:10px; padding:14px; text-align:center; margin:14px 0;">
               <div style="font-size:12px; color:var(--text-muted);">Share this OTP with your driver ONLY once they've arrived</div>
               <div style="font-family:'Poppins',sans-serif; font-size:30px; font-weight:800; color:var(--purple-deep); letter-spacing:6px; margin-top:4px;">${ride.otp}</div>
             </div>`
          : `<div style="text-align:center; margin:10px 0; font-size:12px; color:var(--success); font-weight:600;">✓ Pickup OTP Verified</div>`)
      : '';

    // Live location: the driver app writes its GPS position every few
    // seconds while a ride is active. Distance shown is straight-line
    // ("as the crow flies"), not actual road distance — an honest
    // approximation rather than a real routed ETA, which would need a paid
    // directions API. The map link always opens to wherever the driver
    // currently is, since it's rebuilt fresh on every location update.
    let liveLocationBlock = '';
    if (ride.driverLiveLat && ride.driverLiveLng) {
      const targetLat = ride.status === 'accepted' ? ride.pickupLat : ride.destLat;
      const targetLng = ride.status === 'accepted' ? ride.pickupLng : ride.destLng;
      const distLabel = ride.status === 'accepted' ? 'from your pickup point' : 'from your destination';
      const mapsLink = `https://www.google.com/maps/search/?api=1&query=${ride.driverLiveLat},${ride.driverLiveLng}`;
      const secsAgo = Math.round((Date.now() - (ride.driverLiveUpdatedAt || 0)) / 1000);
      const freshness = secsAgo < 20 ? 'Live' : `Updated ${secsAgo}s ago`;
      let distanceText = '';
      if (targetLat && targetLng) {
        const km = haversineKm(ride.driverLiveLat, ride.driverLiveLng, targetLat, targetLng);
        distanceText = `<strong>${km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km'}</strong> ${distLabel}`;
      }
      liveLocationBlock = `
        <div id="liveRideMap" style="width:100%; height:200px; border-radius:10px; margin-top:12px; background:#2A2440;"></div>
        <div style="background:var(--bg); border-radius:0 0 10px 10px; padding:12px 14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <div style="font-size:13px;">
            <span style="color:var(--success); font-weight:700;">● ${freshness}</span>
            ${distanceText ? '<br>' + distanceText : ''}
          </div>
          <a href="${mapsLink}" target="_blank" style="white-space:nowrap; font-size:12px; font-weight:700; color:var(--purple); text-decoration:underline;">Open in Google Maps</a>
        </div>`;
    }

    driverBlock = `
      ${otpBlock}
      <div class="driver-info" style="overflow:hidden;">
        ${photoHtml}
        <div class="name">${ride.driverName}</div>
        <div class="phone">${ride.driverPhone}${ride.driverVehicle ? ' · ' + ride.driverVehicle : ''}</div>
        <div class="action-grid" style="grid-template-columns:1fr 1fr; margin-top:8px; clear:both;">
          <a href="tel:${ride.driverPhone}" class="btn-call">📞 Call</a>
          <a href="https://wa.me/${ride.driverPhone}" target="_blank" class="btn-wa">💬 WhatsApp</a>
        </div>
        <button onclick="openChatModal('${id}','rider','${ride.driverName}')" style="width:100%; margin-top:8px; padding:10px; border-radius:8px; border:none; background:var(--purple); color:#fff; font-weight:700; font-size:13px;">💬 Chat with Driver</button>
        ${liveLocationBlock}
      </div>`;
    cancelBtn = `<button class="btn-secondary pill-btn" onclick="openCancelModal('${id}')" style="margin-top:8px;">Cancel Ride</button>`;
  }

  // The embedded live map's container above only exists once the card's
  // HTML has actually been written to the page (it's set just below), so
  // draw the map right after that happens — a fresh small map each time
  // is simplest and keeps both markers correctly in view, at the cost of
  // a brief re-center every time the driver's position updates (~6s).
  if (ride.driverLiveLat && ride.driverLiveLng) {
    setTimeout(() => renderLiveRideMap(ride), 30);
  } else if (liveRideMapInstance) {
    liveRideMapInstance.remove();
    liveRideMapInstance = null;
  }

  tabHome.innerHTML = `
    <div class="card status-section">
      <div class="status-badge">${ride.status.replace('_',' ')}</div>
      <div class="status-icon">${icon}</div>
      <div class="status-title">${title}</div>
      <div class="status-sub">${sub}</div>
      <div class="route-summary">
        <span class="dot pickup-dot"></span>${ride.pickup}<br>
        <span class="dot drop-dot"></span>${ride.destination}<br>
        <strong>${ride.agreedFare ? 'Agreed fare: ₹' + ride.agreedFare : 'Your offer: ₹' + ride.fareOffer}</strong>
      </div>
      ${driverBlock}
      ${cancelBtn}
    </div>
    ${offersBlock}
  `;

  const cancelEl = document.getElementById('btnCancel');
  if (cancelEl) cancelEl.addEventListener('click', () => openCancelModal(id));
}

// ================= IN-RIDE CHAT =================
// A simple real-time text chat scoped to one ride, stored under
// rideRequests/{id}/messages. Either side can also share their current GPS
// location as a tappable Google Maps link — built from free browser
// geolocation, no maps API or billing involved.
let activeChatMsgsRef = null;

function openChatModal(id, myRole, otherName) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet" style="display:flex; flex-direction:column; max-height:82vh;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="margin:0;">Chat with ${otherName}</h3>
        <button id="btnCloseChat" style="background:none; border:none; font-size:22px; color:var(--text-muted); line-height:1;">✕</button>
      </div>
      <div id="chatMessages" style="flex:1; overflow-y:auto; min-height:180px; max-height:48vh; display:flex; flex-direction:column; gap:8px; padding:4px 2px;"></div>
      <div style="display:flex; gap:6px; margin-top:12px;">
        <button id="btnShareChatLocation" title="Share current location" style="padding:0 14px; border:none; border-radius:8px; background:#F0EBFA; color:var(--purple); font-size:17px;">📍</button>
        <input id="chatInput" type="text" placeholder="Type a message…" style="flex:1;">
        <button id="btnSendChat" style="padding:0 18px; border:none; border-radius:8px; background:var(--purple); color:#fff; font-weight:700;">Send</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const msgsContainer = overlay.querySelector('#chatMessages');
  activeChatMsgsRef = db.ref('rideRequests/' + id + '/messages');
  activeChatMsgsRef.on('value', snap => {
    const msgs = snap.val() || {};
    const sorted = Object.values(msgs).sort((a, b) => a.ts - b.ts);
    msgsContainer.innerHTML = sorted.length
      ? sorted.map(m => renderChatBubble(m, myRole)).join('')
      : '<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:24px 10px;">No messages yet — say hello, or share your location if there\'s any confusion finding each other.</div>';
    msgsContainer.scrollTop = msgsContainer.scrollHeight;
  });

  function sendChatMessage(text, mapsLink) {
    if (!text && !mapsLink) return;
    activeChatMsgsRef.push({ sender: myRole, text: text || '', mapsLink: mapsLink || null, ts: Date.now() });
  }

  overlay.querySelector('#btnSendChat').addEventListener('click', () => {
    const input = overlay.querySelector('#chatInput');
    const text = input.value.trim();
    if (text) { sendChatMessage(text); input.value = ''; }
  });
  overlay.querySelector('#chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') overlay.querySelector('#btnSendChat').click();
  });
  overlay.querySelector('#btnShareChatLocation').addEventListener('click', () => {
    if (!navigator.geolocation) { alert('GPS not supported on this device/browser.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
      sendChatMessage('📍 Shared current location', link);
    }, () => alert('Could not get your current location. Please check location permission.'));
  });
  overlay.querySelector('#btnCloseChat').addEventListener('click', () => {
    if (activeChatMsgsRef) { activeChatMsgsRef.off(); activeChatMsgsRef = null; }
    overlay.remove();
  });
}

function renderChatBubble(m, myRole) {
  const isMine = m.sender === myRole;
  const bubbleBg = isMine ? 'var(--purple)' : '#F0EBFA';
  const textColor = isMine ? '#fff' : 'var(--text)';
  const linkColor = isMine ? '#fff' : 'var(--purple)';
  const linkHtml = m.mapsLink ? `<br><a href="${m.mapsLink}" target="_blank" style="color:${linkColor}; text-decoration:underline; font-weight:700;">Open in Google Maps</a>` : '';
  const safeText = (m.text || '').replace(/</g, '&lt;');
  return `<div style="align-self:${isMine ? 'flex-end' : 'flex-start'}; max-width:80%; background:${bubbleBg}; color:${textColor}; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.4;">${safeText}${linkHtml}</div>`;
}

function renderOffers(id, offers) {
  if (!offers) return '';
  const activeOffers = Object.entries(offers).filter(([driverId, o]) => o.status !== 'rejected');
  if (activeOffers.length === 0) return '';
  return `
    <div class="section-title" style="margin-top:16px;">Driver Offers</div>
    ${activeOffers.map(([driverId, o]) => {
      if (o.proposedBy === 'driver' && o.status === 'pending') {
        return `
          <div class="card">
            <div style="font-weight:700;">${o.driverName}</div>
            <div style="color:var(--text-muted); font-size:13px; margin-bottom:8px;">${o.driverVehicle || ''}</div>
            <div style="font-size:20px; font-weight:700; color:var(--gold); margin-bottom:10px;">₹${o.amount}</div>
            <div style="display:flex; gap:8px;">
              <button class="btn-secondary" style="flex:1; padding:10px; border-radius:8px; border:none;" onclick="rejectDriverOffer('${id}','${driverId}')">Decline</button>
              <button class="btn-purple" style="flex:1; padding:10px; border-radius:8px; border:none;" onclick="acceptDriverOffer('${id}','${driverId}', ${o.amount})">Accept ₹${o.amount}</button>
            </div>
            <button style="width:100%; margin-top:8px; background:#F0EBFA; color:var(--purple); border:none; padding:10px; border-radius:8px; font-weight:600;" onclick="openRiderCounter('${id}','${driverId}', this)">Counter Back</button>
          </div>`;
      } else if (o.proposedBy === 'rider' && o.status === 'pending') {
        return `<div class="card"><div style="font-weight:700;">${o.driverName}</div><div style="color:var(--text-muted); font-size:13px;">Waiting for driver's response to your ₹${o.amount} counter…</div></div>`;
      }
      return '';
    }).join('')}
  `;
}

function openRiderCounter(id, driverId, btn) {
  const wrap = document.createElement('div');
  wrap.style.marginTop = '8px';
  wrap.innerHTML = `<input type="number" placeholder="Your counter (₹)" style="margin-bottom:6px;" id="riderCounter-${driverId}">
    <button style="width:100%; background:var(--gold); color:var(--purple-deep); border:none; padding:10px; border-radius:8px; font-weight:700;" onclick="submitRiderCounter('${id}','${driverId}')">Send Counter</button>`;
  btn.replaceWith(wrap);
}
function submitRiderCounter(id, driverId) {
  const amount = parseFloat(document.getElementById('riderCounter-' + driverId).value);
  if (!amount || amount <= 0) { alert('Enter a valid amount.'); return; }
  db.ref(`rideRequests/${id}/offers/${driverId}`).update({ amount, proposedBy: 'rider', status: 'pending', updatedAt: Date.now() });
}
function rejectDriverOffer(id, driverId) {
  db.ref(`rideRequests/${id}/offers/${driverId}`).update({ status: 'rejected', updatedAt: Date.now() });
}
function acceptDriverOffer(id, driverId, amount) {
  db.ref('rideRequests/' + id).transaction(current => {
    if (current && current.status === 'requested') {
      const offer = current.offers && current.offers[driverId];
      current.status = 'accepted';
      current.driverId = driverId;
      current.driverName = offer.driverName;
      current.driverPhone = offer.driverPhone;
      current.driverVehicle = offer.driverVehicle;
      current.agreedFare = amount;
      current.acceptedAt = Date.now();
      return current;
    }
    return current;
  }, (error, committed) => { if (!committed) alert('This ride was just taken by another driver.'); });
}

// ================= CANCEL =================
function openCancelModal(id) {
  const reasons = ['Driver too far away', 'Changed my mind', 'Booked by mistake', 'Other'];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>Why are you cancelling?</h3>
      ${reasons.map(r => `<button class="reason-option" data-reason="${r}">${r}</button>`).join('')}
      <button class="reason-option" style="text-align:center; color:var(--text-muted); border:none;" id="btnCloseModal">Never mind</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-reason]').forEach(btn => {
    btn.addEventListener('click', () => {
      db.ref('rideRequests/' + id).update({ status: 'cancelled', cancelReason: btn.dataset.reason, cancelledBy: riderId, cancelledAt: Date.now() });
      overlay.remove();
    });
  });
  document.getElementById('btnCloseModal').addEventListener('click', () => overlay.remove());
}

function renderCancelledScreen() {
  tabHome.innerHTML = `
    <div class="card status-section">
      <div class="status-icon">❌</div>
      <div class="status-title">Request Cancelled</div>
      <div class="status-sub">You can book a new ride anytime</div>
      <button class="pill-btn btn-purple" onclick="renderHome()">Book Another Ride</button>
    </div>`;
}

// ================= RIDE COMPLETION: rating + payment reminder (modal, not the dashboard) =================
function openCompletionModal(id, ride) {
  const fare = ride.agreedFare || ride.fareOffer;
  let selectedStars = 0;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <div style="text-align:center;">
        <div style="font-size:38px; margin-bottom:6px;">🎉</div>
        <h3 style="margin-bottom:4px;">Ride Completed</h3>
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">How was your ride with ${ride.driverName}?</div>
        <div class="star-row" id="completionStarRow">
          ${[1,2,3,4,5].map(n => `<span data-val="${n}">★</span>`).join('')}
        </div>
      </div>
      <div style="background:#FFF7E0; border:1px solid #F2D98A; border-radius:10px; padding:12px; margin:14px 0; font-size:13px; color:#6B5000; line-height:1.6;">
        💵 Please pay <strong>₹${fare}</strong> directly to ${ride.driverName} now — in cash, or by scanning their UPI QR code shown on their phone. GOGUWAHATI does not collect ride fares.
      </div>
      <button class="pill-btn btn-purple" id="btnSubmitCompletionRating">Submit Rating</button>
      <button class="pill-btn btn-flat" style="margin-top:10px;" id="btnSkipCompletionRating">Skip</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const stars = overlay.querySelectorAll('#completionStarRow span');
  stars.forEach(star => {
    star.addEventListener('click', () => {
      selectedStars = parseInt(star.dataset.val);
      stars.forEach(s => s.classList.toggle('filled', parseInt(s.dataset.val) <= selectedStars));
    });
  });

  function finish() {
    if (selectedStars > 0) db.ref('rideRequests/' + id).update({ riderRating: selectedStars });
    overlay.remove();
  }
  overlay.querySelector('#btnSubmitCompletionRating').addEventListener('click', finish);
  overlay.querySelector('#btnSkipCompletionRating').addEventListener('click', finish);
}

// ================= HISTORY TAB =================
function renderHistory() {
  tabHistory.innerHTML = `<div class="card tight"><div class="empty-state">Loading history…</div></div>`;
  db.ref('rideRequests').orderByChild('riderId').equalTo(riderId).once('value', snapshot => {
    const all = snapshot.val() || {};
    const completed = Object.values(all).filter(r => r.status === 'completed').sort((a,b) => (b.completedAt||0) - (a.completedAt||0));
    if (completed.length === 0) {
      tabHistory.innerHTML = `<div class="card tight"><div class="empty-state">No past rides yet</div></div>`;
      return;
    }
    tabHistory.innerHTML = `<div class="card tight">
      ${completed.map(r => `
        <div class="trip-row">
          <div class="trip-top">
            <div style="font-weight:700;">${r.driverName || 'Driver'}</div>
            <div style="font-weight:700; color:var(--purple);">₹${r.agreedFare || r.fareOffer}</div>
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${r.pickup} → ${r.destination}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${new Date(r.completedAt).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'})}${r.riderRating ? ' · ' + '★'.repeat(r.riderRating) : ''}</div>
        </div>
      `).join('')}
    </div>`;
  });
}

      <div style="width:60px; height:60px; border-radius:50%; background:#F0EBFA; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--purple); font-size:22px;">${riderProfile.name.charAt(0)}</div>
      <div>

      </div>
    </div>
    <div class="card tight">
      <div style="font-weight:700; margin-bottom:4px;">App Theme</div>

// ================= INSTALL / SHARE =================
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; });

function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent); }

// ================= AUTO IOS INSTALL BANNER =================
// Detects an iPhone/iPad visitor automatically (no need to tap Install
// first) and shows exact instructions — including the tricky case where
// they're using Chrome or Firefox on iOS, where "Add to Home Screen" isn't
// available at all; only Safari can install web apps on iOS.
function isInStandaloneMode() {
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}
function isIOSNonSafariBrowser() {
  return /CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
}
function showIOSInstallBannerIfNeeded() {
  if (!isIOS() || isInStandaloneMode()) return;
  if (localStorage.getItem('gg_ios_banner_dismissed') === 'true') return;

  const msg = isIOSNonSafariBrowser()
    ? `<strong>To install:</strong> iPhone only allows installing apps from <strong>Safari</strong>. Copy this link and open it in Safari, then tap Share → "Add to Home Screen".`
    : `<strong>To install:</strong> Tap the <strong>Share</strong> icon in Safari, then scroll down and tap <strong>"Add to Home Screen"</strong>.`;

  const banner = document.createElement('div');
  banner.id = 'iosInstallBanner';
  banner.style.cssText = 'position:fixed; left:12px; right:12px; bottom:86px; z-index:500; background:#fff; border:1px solid #e5e0f0; color:var(--text); border-radius:14px; padding:14px 16px; box-shadow:0 6px 20px rgba(36,20,54,0.18); font-size:13px; line-height:1.5; display:flex; gap:10px; align-items:flex-start;';
  banner.innerHTML = `
    <div style="flex:1;">${msg}</div>
    <button id="btnDismissIOSBanner" style="background:none; border:none; color:var(--purple); font-size:19px; line-height:1; padding:0;">✕</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('btnDismissIOSBanner').addEventListener('click', () => {
    banner.remove();
    localStorage.setItem('gg_ios_banner_dismissed', 'true');
  });
}
showIOSInstallBannerIfNeeded();

function setupInstallShare(installBtnId, shareBtnId) {
  const installBtn = document.getElementById(installBtnId);
  const shareBtn = document.getElementById(shareBtnId);
  if (isIOS() && installBtn) {
    installBtn.addEventListener('click', () => alert('On iPhone: tap the Share icon in Safari, then "Add to Home Screen".'));
  } else if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        alert('App may already be installed. Try the browser menu > "Add to Home screen".');
      }
    });
  }
  if (shareBtn) {
    shareBtn.addEventListener('click', () => {
      const shareData = { title: 'GOGUWAHATI', text: 'Book rides with GOGUWAHATI!', url: window.location.href };
      if (navigator.share) { navigator.share(shareData).catch(() => {}); }
      else { navigator.clipboard.writeText(window.location.href); alert('Link copied to clipboard!'); }
    });
  }
}

// Manifest is now a real static manifest.json file (see repo root) instead
// of being generated here at runtime — that runtime/blob approach was set
// AFTER the page had already loaded, which is very likely why Android was
// treating this as a plain "website shortcut" (Chrome badge overlay)
// instead of a properly installed app with a clean icon.

// ================= SERVICE WORKER =================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
}
