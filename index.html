<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOGUWAHATI</title>
<link rel="manifest" id="manifest-link">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --purple-deep: #241436;
    --purple: #6D3FC7;
    --purple-light: #9B7FE8;
    --gold: #F2B705;
    --river: #3E8FB0;
    --bg: #F7F5FC;
    --text: #241436;
    --danger: #E24C4B;
    --success: #2AAE6C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 76px; }
  h1,h2,h3,.brand-font { font-family: 'Poppins', sans-serif; }

  .hero {
    position: relative;
    background: linear-gradient(180deg, var(--purple-deep) 0%, var(--purple) 100%);
    color: #fff;
    padding: 18px 20px 60px;
    overflow: hidden;
  }
  .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .brand-row { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
  .brand-row svg { width: 26px; height: 26px; }
  .hero-status { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; margin-top: 6px; }
  .hero-sub { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  .skyline { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; z-index: 0; }
  .hero-content { position: relative; z-index: 1; }

  main { max-width: 480px; margin: 0 auto; padding: 0 16px; }
  .card {
    background: #fff; border-radius: 14px; padding: 18px;
    margin-top: -34px; margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(36,20,54,0.08);
    position: relative; z-index: 2;
  }
  .card.tight { margin-top: 14px; }
  .pill-btn { width: 100%; padding: 15px; border: none; border-radius: 30px; font-weight: 700; font-size: 16px; cursor: pointer; font-family: 'Poppins', sans-serif; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-gold { background: var(--gold); color: var(--purple-deep); }
  .btn-outline { background: #fff; border: 2px solid var(--purple); color: var(--purple); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-flat { background: #F0EBFA; color: var(--purple-deep); }
  button { font-family: inherit; }

  label { display: block; font-size: 13px; font-weight: 600; color: #555; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; }
  input:focus, select:focus { outline: none; border-color: var(--purple); }

  .loc-box { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin-bottom: 4px; }
  .loc-box .loc-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .loc-box .loc-value { font-size: 14px; font-weight: 600; }
  .loc-btn { margin-top: 8px; width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-size: 13px; background: #F0EBFA; color: var(--purple); }

  /* ===== Address search (autocomplete dropdown) ===== */
  .search-wrap { position: relative; }
  .search-results {
    position: absolute; left: 0; right: 0; top: 100%; background: #fff;
    border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px;
    max-height: 220px; overflow-y: auto; z-index: 50; box-shadow: 0 6px 14px rgba(0,0,0,0.08);
  }
  .search-result-item { padding: 11px 12px; font-size: 13px; border-bottom: 1px solid #f2f2f2; cursor: pointer; }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:active { background: #F0EBFA; }
  .search-loading { padding: 10px 12px; font-size: 12px; color: #999; }

  #destMap { width: 100%; height: 240px; border-radius: 10px; margin: 8px 0; }

  .status-section { text-align: center; }
  .status-icon { width: 60px; height: 60px; border-radius: 50%; background: #F0EBFA; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }
  .status-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .status-sub { font-size: 13px; color: #888; margin-bottom: 20px; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; background: #F0EBFA; color: var(--purple); margin-bottom: 10px; }

  .driver-info { background: var(--bg); border-radius: 10px; padding: 14px; text-align: left; margin: 14px 0; overflow: hidden; }
  .driver-info .name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .driver-info .phone { font-size: 13px; color: #666; }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .action-grid a, .action-grid button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; border: none; }
  .btn-call { background: #E3F7EC; color: var(--success); }
  .btn-wa { background: #E3F2FD; color: #1E6FD9; }

  .route-summary { font-size: 13px; color: #666; text-align: left; margin: 14px 0; line-height: 1.6; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .pickup-dot { background: var(--river); }
  .drop-dot { background: var(--gold); }

  .btn-secondary { background: #eee; color: #555; }

  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1px solid #eee; z-index: 10; }
  .tab { flex: 1; text-align: center; padding: 10px 0 8px; cursor: pointer; color: #999; font-size: 11px; font-weight: 600; }
  .tab.active { color: var(--purple); }
  .tab svg { display: block; margin: 0 auto 3px; width: 22px; height: 22px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; z-index: 100; }
  .modal-sheet { background: #fff; border-radius: 20px 20px 0 0; padding: 22px; width: 100%; max-width: 480px; margin: 0 auto; }
  .modal-sheet h3 { margin-bottom: 14px; }
  .reason-option { display: block; width: 100%; text-align: left; padding: 13px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 10px; background: #fff; font-size: 14px; }
  .reason-option:active { background: #F0EBFA; border-color: var(--purple); }

  .star-row { display: flex; justify-content: center; gap: 8px; margin: 16px 0; }
  .star-row span { font-size: 34px; cursor: pointer; color: #ddd; }
  .star-row span.filled { color: var(--gold); }

  .trip-row { padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
  .trip-row:last-child { border-bottom: none; }
  .trip-top { display: flex; justify-content: space-between; }
  .empty-state { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; }
  .section-title { font-weight: 700; font-size: 15px; margin: 18px 0 10px; }
  .credit-line { text-align: center; font-size: 12px; color: #aaa; margin: 24px 0 10px; }
</style>
</head>
<body>

<div id="authScreen" style="display:none; max-width:400px; margin:60px auto 0; padding:0 20px;">
  <div style="text-align:center; margin-bottom:20px;">
    <div style="font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; color:var(--purple-deep);">GOGUWAHATI</div>
    <div style="font-size:13px; color:#888;">Book a ride</div>
  </div>
  <div class="card">
    <div id="authLoginForm">
      <label>Email</label>
      <input id="loginEmailInput" type="email" placeholder="you@example.com">
      <label>Password</label>
      <input id="loginPassInput" type="password" placeholder="Your password">
      <button class="pill-btn btn-purple" style="margin-top:14px;" id="btnDoLogin">Login</button>
      <div style="text-align:center; margin-top:12px; font-size:13px;">
        <a href="#" id="linkForgotPass" style="color:var(--purple);">Forgot password?</a>
      </div>
      <div style="text-align:center; margin-top:10px; font-size:13px; color:#888;">
        New here? <a href="#" id="linkToRegister" style="color:var(--purple); font-weight:600;">Create account</a>
      </div>
    </div>
    <div id="authRegisterForm" style="display:none;">
      <label>Full Name</label>
      <input id="regNameInput" type="text" placeholder="Your name">
      <label>Phone / WhatsApp Number</label>
      <input id="regPhoneInput" type="tel" placeholder="e.g. 91XXXXXXXXXX">
      <label>Email</label>
      <input id="regEmailInput" type="email" placeholder="you@example.com">
      <label>Password</label>
      <input id="regPassInput" type="password" placeholder="At least 6 characters">
      <button class="pill-btn btn-purple" style="margin-top:14px;" id="btnDoRegister">Create Account</button>
      <div style="text-align:center; margin-top:10px; font-size:13px; color:#888;">
        Already have an account? <a href="#" id="linkToLogin" style="color:var(--purple); font-weight:600;">Login</a>
      </div>
    </div>
    <div id="authError" style="color:var(--danger); font-size:13px; margin-top:10px; text-align:center;"></div>
  </div>
</div>

<div id="appShell" style="display:none;">

<div class="hero">
  <svg class="skyline" viewBox="0 0 400 70" preserveAspectRatio="none">
    <path d="M0,70 L0,45 Q40,20 80,42 T160,38 Q200,15 240,40 T320,35 Q360,20 400,45 L400,70 Z" fill="#3a2456" opacity="0.8"/>
    <path d="M0,70 L0,55 Q50,60 100,52 T200,55 Q250,48 300,54 T400,55 L400,70 Z" fill="var(--river)" opacity="0.55"/>
    <g transform="translate(190,18)" fill="var(--gold)" opacity="0.9">
      <path d="M10,26 L10,10 Q10,4 15,4 Q20,4 20,10 L20,26 Z"/>
      <circle cx="15" cy="3" r="3"/>
      <path d="M2,26 L28,26 L28,20 L2,20 Z"/>
    </g>
  </svg>
  <div class="hero-content">
    <div class="hero-top">
      <div class="brand-row">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="var(--purple-light)"/><circle cx="12" cy="9" r="3.4" fill="#241436"/><path d="M6 19c0-3 2.7-5 6-5s6 2 6 5" stroke="#241436" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        GOGUWAHATI <span style="opacity:0.7; font-weight:500;">Rider</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button id="btnInstallHeader" title="Install App" style="background:rgba(255,255,255,0.15); border:none; width:32px; height:32px; border-radius:8px; color:#fff; font-size:15px;">📲</button>
        <button id="btnShareHeader" title="Share App" style="background:rgba(255,255,255,0.15); border:none; width:32px; height:32px; border-radius:8px; color:#fff; font-size:15px;">🔗</button>
      </div>
    </div>
    <div class="hero-status" id="heroStatus">Loading…</div>
    <div class="hero-sub" id="heroSub"></div>
  </div>
</div>

<main>
  <div id="tab-home"></div>
  <div id="tab-history" style="display:none;"></div>
  <div id="tab-menu" style="display:none;"></div>
</main>

<div class="tabbar">
  <div class="tab active" data-tab="home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
    Home
  </div>
  <div class="tab" data-tab="history" onclick="switchTab('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    History
  </div>
  <div class="tab" data-tab="menu" onclick="switchTab('menu')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    Menu
  </div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ================= FIREBASE CONFIG =================
const firebaseConfig = {
  apiKey: "AIzaSyAGk0uKDDBmSb-IaXRyk2cYp8FfVyhm1w4",
  authDomain: "goguwahati-bf146.firebaseapp.com",
  databaseURL: "https://goguwahati-bf146-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "goguwahati-bf146",
  storageBucket: "goguwahati-bf146.firebasestorage.app",
  messagingSenderId: "931264152406",
  appId: "1:931264152406:web:cd9c56f402a13e12088cf7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// ================= STATE =================
let riderId = null;
let riderProfile = null;
let authReady = false;
let activeRequestId = localStorage.getItem('gg_activeRequestId') || null;
let currentTab = 'home';
let cachedDriverPhoto = null;
let cachedDriverPhotoId = null;
let pickupCoords = null; // {lat, lng, label}
let destCoords = null; // {lat, lng, label}
let destMapInstance = null;
let destMarker = null;
let lastKnownRideStatus = null; // used to detect the accepted -> in_progress transition (driver arrived & picked up)

// Mappls (MapmyIndia) REST API key — used for address autocomplete since it
// has much better coverage of small Indian places (schools, shops, local
// landmarks) than OpenStreetMap. Domain-restricted to heaven948.github.io.
const MAPPLS_KEY = "zhxouvfqxyblexundbqpmktyrpcpgemybzfx";

// ================= APP THEME (rider-chosen, saved locally on this device) =================
const THEMES = {
  purple: { purple:'#6D3FC7', purpleDeep:'#241436', purpleLight:'#9B7FE8', gold:'#F2B705', river:'#3E8FB0', bg:'#F7F5FC' },
  ocean:  { purple:'#1E6FD9', purpleDeep:'#0B2A4A', purpleLight:'#6FA8E8', gold:'#F2B705', river:'#3E8FB0', bg:'#F2F8FD' },
  sunset: { purple:'#D9631E', purpleDeep:'#3A1406', purpleLight:'#F0946A', gold:'#F2B705', river:'#E28743', bg:'#FDF3EC' },
  forest: { purple:'#2E8B57', purpleDeep:'#0F2B1D', purpleLight:'#7FCB9E', gold:'#F2B705', river:'#3E8FB0', bg:'#F1FAF4' }
};
let currentTheme = localStorage.getItem('gg_rider_theme') || 'purple';
function applyTheme(name) {
  const t = THEMES[name] || THEMES.purple;
  const root = document.documentElement.style;
  root.setProperty('--purple', t.purple);
  root.setProperty('--purple-deep', t.purpleDeep);
  root.setProperty('--purple-light', t.purpleLight);
  root.setProperty('--gold', t.gold);
  root.setProperty('--river', t.river);
  root.setProperty('--bg', t.bg);
  currentTheme = name;
  localStorage.setItem('gg_rider_theme', name);
}
applyTheme(currentTheme); // apply immediately on load, before first render, so there's no flash of the default theme

const heroStatus = document.getElementById('heroStatus');
const heroSub = document.getElementById('heroSub');
const tabHome = document.getElementById('tab-home');
const tabHistory = document.getElementById('tab-history');
const tabMenu = document.getElementById('tab-menu');
const authScreen = document.getElementById('authScreen');
const appShell = document.getElementById('appShell');

heroStatus.textContent = 'Connecting…';

// ================= SOUND ALERTS (Web Audio, no files needed) =================
// Same autoplay-policy fix as the driver app: audio only plays reliably if a
// user tap has "unlocked" it first. We unlock on the first tap anywhere, and
// explicitly on Login/Register/Book Ride (all real taps).
let audioCtx;
let audioUnlocked = false;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function unlockAudio() {
  if (audioUnlocked) return;
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  playTone(440, 0.01, 0);
  audioUnlocked = true;
}
function playTone(freq, duration, delay, type='sine') {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
  gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + delay + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration + 0.05);
}
// Driver arrived & picked you up (accepted -> in_progress)
function playDriverArrivedSound() {
  playTone(1200, 0.15, 0);
  playTone(1200, 0.15, 0.22);
  playTone(1200, 0.15, 0.44);
}
// Driver accepted your request
function playDriverAssignedSound() {
  playTone(700, 0.16, 0);
  playTone(950, 0.22, 0.18);
}
function playCancelSound() {
  playTone(400, 0.3, 0, 'sawtooth');
  playTone(280, 0.4, 0.28, 'sawtooth');
}
document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true });

// ================= AUTH =================
auth.onAuthStateChanged(user => {
  if (user) {
    riderId = user.uid;
    authReady = true;
    authScreen.style.display = 'none';
    appShell.style.display = 'block';
    setupInstallShare('btnInstallHeader', 'btnShareHeader');
    loadRiderProfile();
  } else {
    riderId = null;
    authReady = false;
    authScreen.style.display = 'block';
    appShell.style.display = 'none';
  }
});

function showAuthMode(mode) {
  document.getElementById('authLoginForm').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('authRegisterForm').style.display = mode === 'register' ? 'block' : 'none';
}
document.getElementById('linkToRegister').addEventListener('click', () => showAuthMode('register'));
document.getElementById('linkToLogin').addEventListener('click', () => showAuthMode('login'));

document.getElementById('btnDoLogin').addEventListener('click', () => {
  unlockAudio();
  const email = document.getElementById('loginEmailInput').value.trim();
  const pass = document.getElementById('loginPassInput').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Enter email and password.'; return; }
  auth.signInWithEmailAndPassword(email, pass).catch(err => errEl.textContent = err.message);
});

document.getElementById('btnDoRegister').addEventListener('click', () => {
  unlockAudio();
  const name = document.getElementById('regNameInput').value.trim();
  const phone = document.getElementById('regPhoneInput').value.trim();
  const email = document.getElementById('regEmailInput').value.trim();
  const pass = document.getElementById('regPassInput').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if (!name || !phone || !email || pass.length < 6) { errEl.textContent = 'Fill all fields (password min 6 characters).'; return; }
  auth.createUserWithEmailAndPassword(email, pass).then(cred => {
    return db.ref('riders/' + cred.user.uid).set({ name, phone, registeredAt: Date.now() });
  }).catch(err => errEl.textContent = err.message);
});

document.getElementById('linkForgotPass').addEventListener('click', () => {
  const email = document.getElementById('loginEmailInput').value.trim();
  if (!email) { alert('Enter your email above first.'); return; }
  auth.sendPasswordResetEmail(email).then(() => alert('Password reset email sent.')).catch(err => alert(err.message));
});

function loadRiderProfile() {
  db.ref('riders/' + riderId).on('value', snapshot => {
    riderProfile = snapshot.val() || null;
    renderHome();
  });
}

function isBlocked() { return riderProfile && riderProfile.blocked === true; }

// ================= TABS =================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  tabHome.style.display = tab === 'home' ? 'block' : 'none';
  tabHistory.style.display = tab === 'history' ? 'block' : 'none';
  tabMenu.style.display = tab === 'menu' ? 'block' : 'none';
  if (tab === 'history') renderHistory();
  if (tab === 'menu') renderMenu();
}

// ================= HOME =================
function renderHome() {
  if (!authReady) { heroStatus.textContent = 'Connecting…'; return; }

  if (!riderProfile) {
    heroStatus.textContent = 'Almost there!';
    heroSub.textContent = 'Complete your profile to continue';
    renderCompleteProfileForm();
    return;
  }

  if (isBlocked()) {
    heroStatus.textContent = 'Account Suspended';
    heroSub.textContent = 'Your access has been restricted';
    renderBlockedScreen();
    return;
  }

  if (activeRequestId) {
    watchRequest(activeRequestId);
    return;
  }

  heroStatus.textContent = 'Where to?';
  heroSub.textContent = 'Book a ride in a few taps';
  renderBookingForm();
}

function renderCompleteProfileForm() {
  tabHome.innerHTML = `
    <div class="card">
      <label>Full Name</label>
      <input id="fixName" type="text" placeholder="Your name">
      <label>Phone / WhatsApp Number</label>
      <input id="fixPhone" type="tel" placeholder="e.g. 91XXXXXXXXXX">
      <button class="pill-btn btn-purple" style="margin-top:18px;" id="btnFixProfile">Continue</button>
    </div>
  `;
  document.getElementById('btnFixProfile').addEventListener('click', () => {
    const name = document.getElementById('fixName').value.trim();
    const phone = document.getElementById('fixPhone').value.trim();
    if (!name || !phone) { alert('Please fill in both fields.'); return; }
    db.ref('riders/' + riderId).set({ name, phone, registeredAt: Date.now() });
  });
}

function renderBlockedScreen() {
  tabHome.innerHTML = `
    <div class="card">
      <div style="text-align:center; padding:20px 10px;">
        <div style="font-size:40px; margin-bottom:10px;">🚫</div>
        <div style="font-weight:700; font-size:17px; margin-bottom:8px;">Account Suspended</div>
        <div style="font-size:13px; color:#888; line-height:1.6;">Your account has been suspended by GOGUWAHATI. Contact support if you believe this is a mistake.</div>
      </div>
    </div>
  `;
}

// ================= BOOKING FORM =================
function renderBookingForm() {
  tabHome.innerHTML = `
    <div class="card">
      <label>Pickup Location</label>
      <div class="search-wrap">
        <input id="pickupSearch" type="text" placeholder="Type an address, or use GPS below…" autocomplete="off">
        <div id="pickupResults" class="search-results" style="display:none;"></div>
      </div>
      <div class="loc-box" style="margin-top:8px;">
        <div class="loc-label">Selected pickup</div>
        <div class="loc-value" id="pickupLabel">Not set</div>
        <button class="loc-btn" id="btnUseLocation">📍 Use My Current Location</button>
      </div>

      <label>Destination</label>
      <div class="search-wrap">
        <input id="destSearch" type="text" placeholder="Type your destination address…" autocomplete="off">
        <div id="destResults" class="search-results" style="display:none;"></div>
      </div>
      <div id="destMap"></div>
      <div class="loc-box">
        <div class="loc-label">Or tap the map above to drop a pin</div>
        <div class="loc-value" id="destLabel">Not set</div>
      </div>

      <label>Fare Offer (₹)</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-weight:700;">₹</span>
        <input id="inpFare" type="number" placeholder="e.g. 150">
      </div>

      <button class="pill-btn btn-purple" style="margin-top:18px;" id="btnBook">Book Ride</button>
      <div style="text-align:center; font-size:11px; color:#aaa; margin-top:10px;">Address search powered by Mappls</div>
    </div>
  `;

  initDestMap();
  setupAddressSearch('pickupSearch', 'pickupResults', (lat, lng, label) => {
    pickupCoords = { lat, lng, label };
    document.getElementById('pickupLabel').textContent = label;
    document.getElementById('btnUseLocation').textContent = '📍 Update My Location';
  });
  setupAddressSearch('destSearch', 'destResults', (lat, lng, label) => {
    destCoords = { lat, lng, label };
    document.getElementById('destLabel').textContent = label;
    // Move the map + marker to match the typed address so the pin and the
    // text box always agree, and so the rider can still fine-tune by tapping.
    if (destMapInstance) {
      destMapInstance.setView([lat, lng], 15);
      if (destMarker) destMapInstance.removeLayer(destMarker);
      destMarker = L.marker([lat, lng]).addTo(destMapInstance);
    }
  });

  document.getElementById('btnUseLocation').addEventListener('click', () => {
    const btn = document.getElementById('btnUseLocation');
    btn.textContent = 'Locating…';
    if (!navigator.geolocation) { alert('GPS not supported on this device/browser.'); btn.textContent = '📍 Use My Current Location'; return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      reverseGeocode(lat, lng, label => {
        pickupCoords = { lat, lng, label };
        document.getElementById('pickupLabel').textContent = label;
        document.getElementById('pickupSearch').value = label;
        btn.textContent = '📍 Update My Location';
      });
    }, err => {
      alert('Could not get your location: ' + err.message);
      btn.textContent = '📍 Use My Current Location';
    });
  });

  document.getElementById('btnBook').addEventListener('click', () => { unlockAudio(); submitRequest(); });
}

// Live address search tries Mappls (MapmyIndia) first — it has much deeper
// coverage of small Indian places (local schools, shops, landmarks) than
// OpenStreetMap. Mappls' autosuggest only returns a place ID ("eLoc"), not
// coordinates — so once the rider picks a suggestion, one more call resolves
// that eLoc into an actual lat/lng before the pin gets placed. If Mappls
// fails at any step (key/domain issue, network error, unexpected response),
// it automatically falls back to Photon/Nominatim so the search always works.
function setupAddressSearch(inputId, resultsId, onSelect) {
  const input = document.getElementById(inputId);
  const resultsBox = document.getElementById(resultsId);
  let debounceTimer = null;
  let activeToken = 0;

  function searchMappls(query, myToken) {
    return fetch(`https://search.mappls.com/search/places/autosuggest/json?query=${encodeURIComponent(query)}&location=26.1445,91.7362&region=IND&access_token=${MAPPLS_KEY}`)
      .then(r => { if (!r.ok) throw new Error('Mappls HTTP ' + r.status); return r.json(); })
      .then(data => {
        const raw = data.suggestedLocations || [];
        if (!raw.length) throw new Error('Mappls: no results');
        const items = raw.map(loc => ({
          label: loc.placeAddress || loc.placeName || '',
          eLoc: loc.eLoc
        })).filter(it => it.label && it.eLoc);
        if (!items.length) throw new Error('Mappls: unusable results');
        showResults(items, myToken);
      });
  }

  function searchPhoton(query, myToken) {
    return fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=6&lon=91.7362&lat=26.1445`)
      .then(r => { if (!r.ok) throw new Error('Photon HTTP ' + r.status); return r.json(); })
      .then(data => {
        const features = (data && data.features) || [];
        const items = features.map(f => ({
          label: [f.properties.name, f.properties.street, f.properties.city || f.properties.district, f.properties.state, f.properties.country]
            .filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join(', '),
          lat: f.geometry.coordinates[1],
          lon: f.geometry.coordinates[0]
        }));
        showResults(items, myToken);
      });
  }

  // Converts a Mappls eLoc (place ID) into actual coordinates once a rider
  // taps a specific suggestion — done lazily per-pick rather than for every
  // suggestion, to keep this to one lookup instead of six.
  function resolveMapplsCoords(eLoc) {
    return fetch(`https://place.mappls.com/O2O/entity/place-details/${eLoc}?access_token=${MAPPLS_KEY}`)
      .then(r => { if (!r.ok) throw new Error('Place details HTTP ' + r.status); return r.json(); })
      .then(data => {
        const rec = (data.results && data.results[0]) || data;
        const lat = parseFloat(rec.latitude ?? rec.lat ?? (rec.location && rec.location.lat));
        const lon = parseFloat(rec.longitude ?? rec.lng ?? rec.lon ?? (rec.location && rec.location.lng));
        if (isNaN(lat) || isNaN(lon)) throw new Error('No coordinates in place details');
        return { lat, lon };
      });
  }

  // Last-resort: one single one-off Nominatim lookup of the chosen text,
  // only fired if the Mappls coordinate lookup above fails.
  function resolveCoordsFallback(label) {
    return fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(label)}`)
      .then(r => r.json())
      .then(results => {
        if (!results || !results.length) throw new Error('Fallback geocode found nothing');
        return { lat: parseFloat(results[0].lat), lon: parseFloat(results[0].lon) };
      });
  }

  function showResults(items, myToken) {
    if (myToken !== activeToken) return;
    if (items.length === 0) { resultsBox.innerHTML = `<div class="search-loading">No matches found</div>`; return; }
    resultsBox.innerHTML = items.map((it, i) => `<div class="search-result-item" data-idx="${i}">${it.label}</div>`).join('');
    resultsBox.querySelectorAll('.search-result-item').forEach(item => {
      item.addEventListener('click', () => {
        const it = items[item.dataset.idx];
        input.value = it.label;
        resultsBox.style.display = 'none';
        if (it.eLoc) {
          // Mappls result — resolve the eLoc into coordinates first
          resolveMapplsCoords(it.eLoc)
            .catch(() => resolveCoordsFallback(it.label))
            .then(coords => onSelect(coords.lat, coords.lon, it.label))
            .catch(() => alert('Could not pinpoint that location — please try tapping the map or pick a different suggestion.'));
        } else {
          // Photon result — coordinates already included
          onSelect(it.lat, it.lon, it.label);
        }
      });
    });
  }

  input.addEventListener('input', () => {
    const query = input.value.trim();
    clearTimeout(debounceTimer);
    if (query.length < 3) { resultsBox.style.display = 'none'; resultsBox.innerHTML = ''; return; }
    resultsBox.style.display = 'block';
    resultsBox.innerHTML = `<div class="search-loading">Searching…</div>`;
    const myToken = ++activeToken;
    debounceTimer = setTimeout(() => {
      let mapplsError = '';
      searchMappls(query, myToken)
        .catch(err => {
          mapplsError = (err && err.message) || 'unknown Mappls error';
          console.warn('Mappls search failed, falling back to Photon:', mapplsError);
          return searchPhoton(query, myToken);
        })
        .catch(err => {
          if (myToken !== activeToken) return;
          const photonError = (err && err.message) || 'unknown Photon error';
          console.error('Both Mappls and Photon failed:', mapplsError, photonError);
          resultsBox.innerHTML = `<div class="search-loading">Search failed.<br><small>Mappls: ${mapplsError}<br>Photon: ${photonError}</small></div>`;
        });
    }, 350);
  });

  document.addEventListener('click', e => {
    if (e.target !== input) resultsBox.style.display = 'none';
  });
}

function initDestMap() {
  setTimeout(() => {
    const container = document.getElementById('destMap');
    if (!container) return;
    destMapInstance = L.map('destMap').setView([26.1445, 91.7362], 12); // Guwahati default center
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(destMapInstance);

    destMapInstance.on('click', e => {
      const { lat, lng } = e.latlng;
      if (destMarker) destMapInstance.removeLayer(destMarker);
      destMarker = L.marker([lat, lng]).addTo(destMapInstance);
      document.getElementById('destLabel').textContent = 'Locating address…';
      reverseGeocode(lat, lng, label => {
        destCoords = { lat, lng, label };
        document.getElementById('destLabel').textContent = label;
        document.getElementById('destSearch').value = label;
      });
    });
  }, 50);
}

function reverseGeocode(lat, lng, callback) {
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
    .then(r => r.json())
    .then(data => callback(data.display_name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`))
    .catch(() => callback(`${lat.toFixed(4)}, ${lng.toFixed(4)}`));
}

function submitRequest() {
  const fareOffer = document.getElementById('inpFare').value.trim();
  if (!pickupCoords) { alert('Please set your pickup location.'); return; }
  if (!destCoords) { alert('Please set your destination.'); return; }
  if (!fareOffer) { alert('Please enter a fare offer.'); return; }

  const newRef = db.ref('rideRequests').push();
  newRef.set({
    riderId,
    riderName: riderProfile.name,
    riderPhone: riderProfile.phone,
    pickup: pickupCoords.label,
    pickupLat: pickupCoords.lat,
    pickupLng: pickupCoords.lng,
    destination: destCoords.label,
    destLat: destCoords.lat,
    destLng: destCoords.lng,
    fareOffer,
    status: 'requested',
    createdAt: Date.now()
  }).then(() => {
    activeRequestId = newRef.key;
    localStorage.setItem('gg_activeRequestId', newRef.key);
    pickupCoords = null; destCoords = null;
    lastKnownRideStatus = 'requested';
    renderHome();
  }).catch(() => alert('Could not post request. Please try again.'));
}

// ================= WATCH ACTIVE REQUEST =================
function watchRequest(id) {
  db.ref('rideRequests/' + id).on('value', snapshot => {
    const ride = snapshot.val();
    if (!ride) { clearActiveRequest(); renderHome(); return; }
    if (ride.status === 'completed') {
      db.ref('rideRequests/' + id).off(); // this ride is finalized, stop listening to it
      clearActiveRequest();
      renderHome(); // dashboard goes straight back to "Book a ride" — the finished ride lives in History, not here
      openCompletionModal(id, ride);
      return;
    }
    if (ride.status === 'cancelled') { db.ref('rideRequests/' + id).off(); clearActiveRequest(); renderCancelledScreen(); return; }

    // Sound alerts on status transitions (a driver being newly assigned, or
    // arriving to pick you up), not on every generic Firebase update.
    if (lastKnownRideStatus === 'requested' && ride.status === 'accepted') {
      playDriverAssignedSound();
    }
    if (lastKnownRideStatus === 'accepted' && ride.status === 'in_progress') {
      playDriverArrivedSound();
    }
    lastKnownRideStatus = ride.status;

    heroStatus.textContent = ride.status === 'requested' ? 'Finding a driver…' : ride.status === 'accepted' ? 'Driver assigned!' : 'Ride in progress';
    heroSub.textContent = '';
    renderRideStatus(id, ride);
  });
}

function clearActiveRequest() {
  activeRequestId = null;
  localStorage.removeItem('gg_activeRequestId');
  lastKnownRideStatus = null;
}

function renderRideStatus(id, ride) {
  let icon, title, sub, driverBlock = '', cancelBtn = '', offersBlock = '';

  if (ride.status === 'requested') {
    icon = '🔍'; title = 'Finding a driver…'; sub = 'Waiting for a driver to accept your request';
    cancelBtn = `<button class="btn-secondary pill-btn" id="btnCancel">Cancel Request</button>`;
    offersBlock = renderOffers(id, ride.offers);
  } else if (ride.status === 'accepted' || ride.status === 'in_progress') {
    icon = ride.status === 'accepted' ? '✅' : '🚗';
    title = ride.status === 'accepted' ? 'Driver assigned!' : 'Driver arrived — ride in progress';
    sub = ride.status === 'accepted' ? 'Your driver is on the way' : 'Enjoy your ride!';

    if (cachedDriverPhotoId !== ride.driverId) {
      db.ref('drivers/' + ride.driverId + '/photoBase64').once('value', snap => {
        cachedDriverPhoto = snap.val();
        cachedDriverPhotoId = ride.driverId;
        renderRideStatus(id, ride);
      });
    }
    const photoHtml = (cachedDriverPhotoId === ride.driverId && cachedDriverPhoto)
      ? `<img src="${cachedDriverPhoto}" style="width:54px; height:54px; border-radius:50%; object-fit:cover; float:left; margin-right:12px;">`
      : `<div style="width:54px; height:54px; border-radius:50%; background:#eee; float:left; margin-right:12px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#999;">${(ride.driverName||'D').charAt(0)}</div>`;

    // Reminder button so the rider knows to send their exact pickup (or,
    // once picked up, destination) location via WhatsApp's own location
    // picker — same free, pinpoint-accurate Google Maps search the driver
    // already gets on their end when they tap this.
    const locationReminderText = ride.status === 'in_progress'
      ? `Hi ${ride.driverName}, here's my exact drop-off location:`
      : `Hi ${ride.driverName}, here's my exact pickup location:`;
    const locationReminderLabel = ride.status === 'in_progress' ? '📍 Send Drop-off Location' : '📍 Send Pickup Location';

    driverBlock = `
      <div class="driver-info" style="overflow:hidden;">
        ${photoHtml}
        <div class="name">${ride.driverName}</div>
        <div class="phone">${ride.driverPhone}${ride.driverVehicle ? ' · ' + ride.driverVehicle : ''}</div>
        <div class="action-grid" style="grid-template-columns:1fr 1fr; margin-top:8px; clear:both;">
          <a href="tel:${ride.driverPhone}" class="btn-call">📞 Call</a>
          <a href="https://wa.me/${ride.driverPhone}" target="_blank" class="btn-wa">💬 WhatsApp</a>
        </div>
        <a href="https://wa.me/${ride.driverPhone}?text=${encodeURIComponent(locationReminderText)}" target="_blank" style="display:block; text-align:center; text-decoration:none; margin-top:8px; padding:10px; border-radius:8px; background:#F0EBFA; color:var(--purple); font-size:13px; font-weight:600;">${locationReminderLabel}<br><span style="font-weight:400; font-size:11px; color:#888;">Opens WhatsApp — tap 📎 → Location → Send Your Current Location (not Live Location)</span></a>
      </div>`;
    cancelBtn = `<button class="btn-secondary pill-btn" onclick="openCancelModal('${id}')" style="margin-top:8px;">Cancel Ride</button>`;
  }

  tabHome.innerHTML = `
    <div class="card status-section">
      <div class="status-badge">${ride.status.replace('_',' ')}</div>
      <div class="status-icon">${icon}</div>
      <div class="status-title">${title}</div>
      <div class="status-sub">${sub}</div>
      <div class="route-summary">
        <span class="dot pickup-dot"></span>${ride.pickup}<br>
        <span class="dot drop-dot"></span>${ride.destination}<br>
        <strong>${ride.agreedFare ? 'Agreed fare: ₹' + ride.agreedFare : 'Your offer: ₹' + ride.fareOffer}</strong>
      </div>
      ${driverBlock}
      ${cancelBtn}
    </div>
    ${offersBlock}
  `;

  const cancelEl = document.getElementById('btnCancel');
  if (cancelEl) cancelEl.addEventListener('click', () => openCancelModal(id));
}

function renderOffers(id, offers) {
  if (!offers) return '';
  const activeOffers = Object.entries(offers).filter(([driverId, o]) => o.status !== 'rejected');
  if (activeOffers.length === 0) return '';
  return `
    <div class="section-title" style="margin-top:16px;">Driver Offers</div>
    ${activeOffers.map(([driverId, o]) => {
      if (o.proposedBy === 'driver' && o.status === 'pending') {
        return `
          <div class="card">
            <div style="font-weight:700;">${o.driverName}</div>
            <div style="color:#888; font-size:13px; margin-bottom:8px;">${o.driverVehicle || ''}</div>
            <div style="font-size:20px; font-weight:700; color:var(--gold); margin-bottom:10px;">₹${o.amount}</div>
            <div style="display:flex; gap:8px;">
              <button class="btn-secondary" style="flex:1; padding:10px; border-radius:8px; border:none;" onclick="rejectDriverOffer('${id}','${driverId}')">Decline</button>
              <button class="btn-purple" style="flex:1; padding:10px; border-radius:8px; border:none;" onclick="acceptDriverOffer('${id}','${driverId}', ${o.amount})">Accept ₹${o.amount}</button>
            </div>
            <button style="width:100%; margin-top:8px; background:#F0EBFA; color:var(--purple); border:none; padding:10px; border-radius:8px; font-weight:600;" onclick="openRiderCounter('${id}','${driverId}', this)">Counter Back</button>
          </div>`;
      } else if (o.proposedBy === 'rider' && o.status === 'pending') {
        return `<div class="card"><div style="font-weight:700;">${o.driverName}</div><div style="color:#888; font-size:13px;">Waiting for driver's response to your ₹${o.amount} counter…</div></div>`;
      }
      return '';
    }).join('')}
  `;
}

function openRiderCounter(id, driverId, btn) {
  const wrap = document.createElement('div');
  wrap.style.marginTop = '8px';
  wrap.innerHTML = `<input type="number" placeholder="Your counter (₹)" style="margin-bottom:6px;" id="riderCounter-${driverId}">
    <button style="width:100%; background:var(--gold); color:var(--purple-deep); border:none; padding:10px; border-radius:8px; font-weight:700;" onclick="submitRiderCounter('${id}','${driverId}')">Send Counter</button>`;
  btn.replaceWith(wrap);
}
function submitRiderCounter(id, driverId) {
  const amount = parseFloat(document.getElementById('riderCounter-' + driverId).value);
  if (!amount || amount <= 0) { alert('Enter a valid amount.'); return; }
  db.ref(`rideRequests/${id}/offers/${driverId}`).update({ amount, proposedBy: 'rider', status: 'pending', updatedAt: Date.now() });
}
function rejectDriverOffer(id, driverId) {
  db.ref(`rideRequests/${id}/offers/${driverId}`).update({ status: 'rejected', updatedAt: Date.now() });
}
function acceptDriverOffer(id, driverId, amount) {
  db.ref('rideRequests/' + id).transaction(current => {
    if (current && current.status === 'requested') {
      const offer = current.offers && current.offers[driverId];
      current.status = 'accepted';
      current.driverId = driverId;
      current.driverName = offer.driverName;
      current.driverPhone = offer.driverPhone;
      current.driverVehicle = offer.driverVehicle;
      current.agreedFare = amount;
      current.acceptedAt = Date.now();
      return current;
    }
    return current;
  }, (error, committed) => { if (!committed) alert('This ride was just taken by another driver.'); });
}

// ================= CANCEL =================
function openCancelModal(id) {
  const reasons = ['Driver too far away', 'Changed my mind', 'Booked by mistake', 'Other'];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>Why are you cancelling?</h3>
      ${reasons.map(r => `<button class="reason-option" data-reason="${r}">${r}</button>`).join('')}
      <button class="reason-option" style="text-align:center; color:#999; border:none;" id="btnCloseModal">Never mind</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-reason]').forEach(btn => {
    btn.addEventListener('click', () => {
      db.ref('rideRequests/' + id).update({ status: 'cancelled', cancelReason: btn.dataset.reason, cancelledBy: riderId, cancelledAt: Date.now() });
      overlay.remove();
    });
  });
  document.getElementById('btnCloseModal').addEventListener('click', () => overlay.remove());
}

function renderCancelledScreen() {
  tabHome.innerHTML = `
    <div class="card status-section">
      <div class="status-icon">❌</div>
      <div class="status-title">Request Cancelled</div>
      <div class="status-sub">You can book a new ride anytime</div>
      <button class="pill-btn btn-purple" onclick="renderHome()">Book Another Ride</button>
    </div>`;
}

// ================= RIDE COMPLETION: rating + payment reminder (modal, not the dashboard) =================
function openCompletionModal(id, ride) {
  const fare = ride.agreedFare || ride.fareOffer;
  let selectedStars = 0;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <div style="text-align:center;">
        <div style="font-size:38px; margin-bottom:6px;">🎉</div>
        <h3 style="margin-bottom:4px;">Ride Completed</h3>
        <div style="font-size:13px; color:#888; margin-bottom:14px;">How was your ride with ${ride.driverName}?</div>
        <div class="star-row" id="completionStarRow">
          ${[1,2,3,4,5].map(n => `<span data-val="${n}">★</span>`).join('')}
        </div>
      </div>
      <div style="background:#FFF7E0; border:1px solid #F2D98A; border-radius:10px; padding:12px; margin:14px 0; font-size:13px; color:#6B5000; line-height:1.6;">
        💵 Please pay <strong>₹${fare}</strong> directly to ${ride.driverName} now — in cash, or by scanning their UPI QR code shown on their phone. GOGUWAHATI does not collect ride fares.
      </div>
      <button class="pill-btn btn-purple" id="btnSubmitCompletionRating">Submit Rating</button>
      <button class="pill-btn btn-flat" style="margin-top:10px;" id="btnSkipCompletionRating">Skip</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const stars = overlay.querySelectorAll('#completionStarRow span');
  stars.forEach(star => {
    star.addEventListener('click', () => {
      selectedStars = parseInt(star.dataset.val);
      stars.forEach(s => s.classList.toggle('filled', parseInt(s.dataset.val) <= selectedStars));
    });
  });

  function finish() {
    if (selectedStars > 0) db.ref('rideRequests/' + id).update({ riderRating: selectedStars });
    overlay.remove();
  }
  overlay.querySelector('#btnSubmitCompletionRating').addEventListener('click', finish);
  overlay.querySelector('#btnSkipCompletionRating').addEventListener('click', finish);
}

// ================= HISTORY TAB =================
function renderHistory() {
  tabHistory.innerHTML = `<div class="card tight"><div class="empty-state">Loading history…</div></div>`;
  db.ref('rideRequests').orderByChild('riderId').equalTo(riderId).once('value', snapshot => {
    const all = snapshot.val() || {};
    const completed = Object.values(all).filter(r => r.status === 'completed').sort((a,b) => (b.completedAt||0) - (a.completedAt||0));
    if (completed.length === 0) {
      tabHistory.innerHTML = `<div class="card tight"><div class="empty-state">No past rides yet</div></div>`;
      return;
    }
    tabHistory.innerHTML = `<div class="card tight">
      ${completed.map(r => `
        <div class="trip-row">
          <div class="trip-top">
            <div style="font-weight:700;">${r.driverName || 'Driver'}</div>
            <div style="font-weight:700; color:var(--purple);">₹${r.agreedFare || r.fareOffer}</div>
          </div>
          <div style="font-size:12px; color:#999; margin-top:2px;">${r.pickup} → ${r.destination}</div>
          <div style="font-size:12px; color:#999; margin-top:2px;">${new Date(r.completedAt).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'})}${r.riderRating ? ' · ' + '★'.repeat(r.riderRating) : ''}</div>
        </div>
      `).join('')}
    </div>`;
  });
}

// ================= MENU TAB =================
function renderMenu() {
  if (!riderProfile) { tabMenu.innerHTML = `<div class="card tight empty-state">Loading…</div>`; return; }
  tabMenu.innerHTML = `
    <div class="card tight" style="display:flex; gap:14px; align-items:center;">
      <div style="width:60px; height:60px; border-radius:50%; background:#F0EBFA; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--purple); font-size:22px;">${riderProfile.name.charAt(0)}</div>
      <div>
        <div style="font-weight:700; font-size:16px;">${riderProfile.name}</div>
        <div style="font-size:13px; color:#888; margin-top:2px;">${riderProfile.phone}</div>
      </div>
    </div>
    <div class="card tight">
      <div style="font-weight:700; margin-bottom:4px;">App Theme</div>
      <div style="font-size:12px; color:#888; margin-bottom:12px;">Choose a background theme for your app</div>
      <div style="display:flex; gap:14px;" id="themeSwatches">
        ${Object.keys(THEMES).map(name => `
          <button data-theme="${name}" title="${name}" style="width:42px; height:42px; border-radius:50%; border:3px solid ${currentTheme === name ? '#241436' : 'transparent'}; background:${THEMES[name].purple}; cursor:pointer;"></button>
        `).join('')}
      </div>
    </div>

    <div class="card tight">
      <button class="pill-btn btn-flat" id="btnLogoutRider">Logout</button>
    </div>
    <div class="credit-line">GOGUWAHATI by Marak Innovation</div>
  `;
  document.querySelectorAll('#themeSwatches button').forEach(btn => {
    btn.addEventListener('click', () => {
      applyTheme(btn.dataset.theme);
      renderMenu(); // re-render so the selected swatch's border updates
    });
  });
  document.getElementById('btnLogoutRider').addEventListener('click', () => {
    if (confirm('Logout of your account?')) auth.signOut();
  });
}

// ================= INSTALL / SHARE =================
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; });

function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent); }

function setupInstallShare(installBtnId, shareBtnId) {
  const installBtn = document.getElementById(installBtnId);
  const shareBtn = document.getElementById(shareBtnId);
  if (isIOS() && installBtn) {
    installBtn.addEventListener('click', () => alert('On iPhone: tap the Share icon in Safari, then "Add to Home Screen".'));
  } else if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        alert('App may already be installed. Try the browser menu > "Add to Home screen".');
      }
    });
  }
  if (shareBtn) {
    shareBtn.addEventListener('click', () => {
      const shareData = { title: 'GOGUWAHATI', text: 'Book rides with GOGUWAHATI!', url: window.location.href };
      if (navigator.share) { navigator.share(shareData).catch(() => {}); }
      else { navigator.clipboard.writeText(window.location.href); alert('Link copied to clipboard!'); }
    });
  }
}

  <g transform="translate(156,120)">
